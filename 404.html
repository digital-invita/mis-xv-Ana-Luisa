<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <title>404 | Página no encontrada - DigitalInvita</title>
  <meta name="theme-color" content="#a000e8" />
  <link rel="icon" type="image/png" href="favicon.png" />

  <style>
    :root {
      --purple: #8200dd;
      --purple-2: #a900e8;
      --pink: #ff00bc;
      --ink: #241738;
      --muted: #706781;
      --gradient: linear-gradient(135deg, var(--purple) 10%, var(--purple-2) 52%, var(--pink) 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 18%, rgba(169, 0, 232, .10), transparent 22%),
        radial-gradient(circle at 50% 78%, rgba(255, 0, 188, .05), transparent 20%),
        linear-gradient(180deg, #ffffff 0%, #fbf8fd 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 34px;
      left: 34px;
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, var(--pink), #c300ff);
      border-radius: 2px;
      box-shadow: 0 12px 20px rgba(255, 0, 188, .12);
      opacity: .95;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      top: 34px;
      right: 48px;
      width: 88px;
      height: 126px;
      opacity: .30;
      background-image: radial-gradient(circle, #d8c9e7 1.4px, transparent 1.4px);
      background-size: 14px 14px;
      pointer-events: none;
    }

    .page {
      width: min(920px, calc(100% - 36px));
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 46px 0 28px;
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-bottom: 34px;
    }

    .brand img {
      width: min(500px, 80vw);
      height: auto;
      display: block;
    }

    .content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .error-code {
      font-size: clamp(7rem, 20vw, 13rem);
      font-weight: 900;
      line-height: .82;
      letter-spacing: -.08em;
      padding-right: .08em;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 12px 26px rgba(157, 0, 223, .16));
    }

    h1 {
      margin-top: 30px;
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: 1.04;
      letter-spacing: -.04em;
      font-weight: 760;
    }

    .accent {
      width: 84px;
      height: 4px;
      border-radius: 999px;
      background: var(--gradient);
      margin: 24px auto;
      box-shadow: 0 5px 14px rgba(255, 0, 188, .15);
    }

    .description {
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.75;
      max-width: 700px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 32px;
    }

    .btn {
      min-height: 54px;
      padding: 0 24px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 700;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      border: 1px solid transparent;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      color: #fff;
      background: var(--gradient);
      box-shadow: 0 14px 28px rgba(156, 0, 217, .22);
    }

    .btn-secondary {
      color: var(--purple);
      background: rgba(255,255,255,.9);
      border-color: rgba(156, 0, 217, .28);
      box-shadow: 0 8px 18px rgba(102, 0, 158, .05);
    }

    .btn-secondary:hover {
      background: #fff;
      box-shadow: 0 12px 26px rgba(89, 0, 126, .10);
    }

    .btn svg {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
    }

    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      color: #8b42b5;
      font-size: 1rem;
      margin-top: 46px;
      padding-top: 12px;
      text-align: center;
    }

    footer .mini {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      background: var(--gradient);
      box-shadow: 0 6px 12px rgba(255, 0, 188, .14);
    }

    @media (max-width: 560px) {
      body::before {
        top: 22px;
        left: 22px;
        width: 18px;
        height: 18px;
      }

      body::after {
        top: 22px;
        right: 24px;
        width: 72px;
        height: 112px;
      }

      .page {
        width: min(100% - 28px, 920px);
        padding-top: 34px;
      }

      .brand {
        margin-bottom: 22px;
      }

      h1 {
        margin-top: 22px;
      }

      .description {
        line-height: 1.6;
      }

      .actions {
        width: 100%;
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      footer {
        margin-top: 36px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand">
     <img src="logo.png" alt="DigitalInvita - Invitaciones Digitales" />
    </div>

    <section class="content" aria-labelledby="error-title">
      <div class="error-code" aria-hidden="true">404</div>
      <h1 id="error-title">Página no encontrada</h1>
      <div class="accent"></div>

      <p class="description">
        La invitación o página que buscas no está disponible en este momento.
        Es posible que el enlace sea incorrecto, haya expirado o que el sitio esté en mantenimiento.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="https://digitalinvita.com.mx/" aria-label="Ir al sitio principal de DigitalInvita">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 11 9-8 9 8" />
            <path d="M5 10v10h14V10" />
            <path d="M9 20v-6h6v6" />
          </svg>
          Volver al inicio
        </a>

        <a class="btn btn-secondary" href="https://wa.me/525550591264" target="_blank" rel="noopener noreferrer" aria-label="Contactar soporte por WhatsApp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" />
          </svg>
          Contactar soporte
        </a>
      </div>
    </section>

    <footer>
      <span class="mini"></span>
      <span>Creamos momentos inolvidables</span>
    </footer>
  </main>
</body>
</html>
